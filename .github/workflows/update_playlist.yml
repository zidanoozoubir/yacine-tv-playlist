name: Update IPTV Playlist

on:
  schedule:
    # تشغيل تلقائي كل 30 دقيقة
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Scraper and Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_ID_2: ${{ secrets.GIST_ID_2 }}
          GIST_ID_NEW: ${{ secrets.GIST_ID_NEW }}
          APP2_M3U_URL: ${{ secrets.APP2_M3U_URL }}
        run: python yacine_scraper.py
